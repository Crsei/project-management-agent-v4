[package]
name = "cc-switch-host"
version = "4.0.25"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[features]
default = ["headless"]
headless = []

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
futures = "0.3"
fs2 = "0.4"
http = "1"
indexmap = { version = "2", features = ["serde"] }
json5 = "0.4"
json-five = "0.3.1"
log = { version = "0.4", features = ["std"] }
once_cell = "1.21.3"
process-wrap = { version = "8.2", features = ["tokio1"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "socks"] }
rmcp = { version = "0.8.5", features = ["client", "transport-async-rw", "transport-sse-client-reqwest", "transport-streamable-http-client-reqwest"] }
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "net", "process", "io-util", "io-std"] }
toml = "0.8"
toml_edit = "0.22"
url = "2.5"
uuid = { version = "1.11", features = ["v4"] }
zip = "2.2"

[target.'cfg(not(target_os = "windows"))'.dependencies]
libc = "0.2"
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[dev-dependencies]
serial_test = "3"
axum = "0.7"
async-stream = "0.3"
tokio = { version = "1", features = ["test-util"] }

[profile.release]
codegen-units = 16
lto = "thin"
opt-level = "s"
strip = "symbols"
