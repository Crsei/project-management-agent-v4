<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="%BASE_URL%favicon.ico" />
    <title>Agent Chat · PM v3</title>
    <meta name="description" content="Project Management v3 Agent Chat" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 与 Next 版 next/font 相同的两个字体族，变量由 styles/globals.css 定义 -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!--
      SPA 首屏骨架：纯内联 CSS，不依赖任何 JS/CSS 产物，TTFB 后即可上屏。
      React 首次 commit 时会清掉 #root 的既有子节点（createRoot 行为），
      骨架与真实外壳同为深色版式，避免主题闪变与明显位移。
    -->
    <style>
      html,
      body {
        margin: 0;
        /* 仅覆盖「应用 CSS 就位之前」的首帧：默认深色（应用默认主题） */
        background: #111110;
      }
      .boot {
        color: #ecece8;
      }
      #root:empty {
        display: block;
      }
      .boot {
        display: flex;
        min-height: 100vh;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      .boot-aside {
        width: 16rem;
        border-right: 1px solid rgba(255, 255, 255, 0.1);
        padding: 1rem;
      }
      .boot-brand {
        display: flex;
        gap: 0.625rem;
        align-items: center;
        font-weight: 600;
        font-size: 0.875rem;
      }
      .boot-mark {
        width: 2rem;
        height: 2rem;
        border-radius: 0.5rem;
        background: rgba(255, 255, 255, 0.9);
      }
      .boot-sub {
        color: rgba(255, 255, 255, 0.45);
        font-size: 0.75rem;
        font-weight: 400;
      }
      .boot-row {
        height: 2rem;
        margin-top: 0.75rem;
        border-radius: 0.5rem;
        background: rgba(255, 255, 255, 0.06);
      }
      .boot-main {
        display: flex;
        flex: 1;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        color: rgba(255, 255, 255, 0.5);
        font-size: 0.875rem;
      }
      .boot-pulse {
        animation: boot-pulse 1.4s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        50% {
          opacity: 0.35;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-pulse {
          animation: none;
        }
      }
    </style>
  </head>
  <body class="antialiased">
    <script>
      // 主题在首帧前定调，避免浅色闪一下再切深色（存储不可用时保持 <html> 上的默认深色）
      try {
        var t = localStorage.getItem("agent-workspace:theme");
        document.documentElement.classList.toggle("dark", t !== "light");
      } catch (e) {}
    </script>
    <div id="root">
      <div class="boot" role="status" aria-live="polite">
        <aside class="boot-aside">
          <div class="boot-brand">
            <span class="boot-mark"></span>
            <span>agent-workspace<br /><span class="boot-sub">Native Agent chat</span></span>
          </div>
          <div class="boot-row"></div>
          <div class="boot-row"></div>
          <div class="boot-row"></div>
        </aside>
        <main class="boot-main">
          <span class="boot-pulse">Loading workspace…</span>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
