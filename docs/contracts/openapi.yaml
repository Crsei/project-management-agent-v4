    get:
      operationId: subscribeEvents
      summary: SSE invalidation stream with durable workspace cursor
      description: after query takes precedence over Last-Event-ID; default is 0. Authorization and cursor are checked before
        headers and again every batch. change frames carry ChangeNotification and id=cursor; checkpoint frames carry
        {cursor} and advance over filtered positions. Comments are heartbeats. After headers, failures are stream_error
        frames with {code}, followed by closure. Slow streams close once the pending write buffer exceeds 1 MiB;
        reconnect explicitly from the last checkpoint. No automatic replay of commands. For cursor_expired (HTTP 410, or
        stream_error), reload an authorized entity snapshot and subscribe from its cursor; invalid/ahead cursors return
        400/409.
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
