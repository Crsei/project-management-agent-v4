  /api/v1/workspaces/{workspaceId}/local-projects/settings:
    get:
      operationId: getLocalProjectSettings
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      description: Authenticated session and Origin policy apply. Host paths require unrestricted access.manage; writes
        additionally require planning.edit. Settings and project location redact paths for other authorized readers.
        Directory roots originate only in trusted local configuration. Initialization preserves native creation facts,
        not command receipts. Recover only the original identity; not_found or pending never permits replacing the key.
        Storage moves require explicit external-writers-stopped acknowledgement and retain a durable project fence until
        verified recovery.
      responses:
        "200":
          description: Authorized current result; pending remains unresolved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                  reason:
                    enum:
                      - not_configured
                      - null
                  canManage:
                    type: boolean
                  dataRoot:
                    type:
                      - string
                      - "null"
                  coreRoot:
                    type:
                      - string
                      - "null"
                  defaultParent:
                    type:
                      - string
                      - "null"
                  allowedRoots:
                    type: array
                    items:
                      type: string
                  backupRoot:
                    type:
                      - string
                      - "null"
                  attachments:
                    const: project_directory
                  databaseRequired:
                    const: true
                required:
                  - enabled
                  - reason
                  - canManage
                  - dataRoot
                  - coreRoot
                  - defaultParent
                  - allowedRoots
                  - backupRoot
                  - attachments
                  - databaseRequired
                additionalProperties: false
        "400":
          description: Authorized validation, storage, or recoverable uncertainty error. Retain the original request/key. No
            automatic retry.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - type: object
                    properties:
                      error:
                        type: string
                      diagnostics:
                        type: array
                        items:
                          type: object
                    required:
                      - error
                      - diagnostics
        "401":
          description: Authorized validation, storage, or recoverable uncertainty error. Retain the original request/key. No
            automatic retry.
          content:
