              additionalProperties: false
      description: "SSE events: user, assistant, delta, capabilities, context, tool, done, cancelled, error. capabilities
        carries {messageId,access}, context {messageId,sources}, tool {messageId,toolCall}; assistant snapshots retain
        actual tool calls and sources, never raw model thinking. reasoningEffort applies to every model round of this
        message only; auto omits the override. A non-auto value not advertised by status is rejected with 400
        agent_reasoning_unsupported before either message is persisted. The client messageId is idempotent within the
        thread. Only one reply may stream per thread. Closing the reader does not cancel generation; POST cancel is
        explicit. EOF without done/cancelled/error leaves the result unknown; reconcile via GET thread, never blindly
        resend. Model text is not a business fact; only scoped, server-authorized native tools can write PM data."
