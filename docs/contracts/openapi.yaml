              schema:
                type: string
              example: |+
                id: 12
                event: change
                data: {"eventId":"00000000-0000-4000-8000-000000000001","eventType":"ProjectCreated","workspaceId":"00000000-0000-4000-8000-000000000002","projectId":null,"aggregateId":"00000000-0000-4000-8000-000000000003","aggregateKind":"project","aggregateVersion":1,"occurredAt":"2026-10-16T00:00:00.000Z"}

                id: 12
