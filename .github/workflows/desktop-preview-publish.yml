name: Publish verified desktop preview
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: desktop-preview-v0.1.0-preview.1
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Verify original artifacts and publish complete prerelease
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import hashlib
          import json
          import os
          import pathlib
          import shutil
          import stat
          import tempfile
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile

          REPO = 'Crsei/project-management-agent-v4'
          SHA = 'a063dc07b06f82c1123dfeeb3f93b22b0fb33542'
          RUN = 41750883115
          TAG = 'v0.1.0-preview.1'
          EXPECTED = {
              'desktop-unsigned-win32-x64': (13288840567, 'd78e0a4db6fc77265962755bf0e112305f4f90ac51d3681dbe4f98d197d526b6'),
              'desktop-unsigned-darwin-x64': (13286788249, 'bee981539ff9544ef043a6de05b66993b673cd28398d6c05dfac98865004491f'),
              'desktop-unsigned-darwin-arm64': (13286046556, 'cb0033b8776cbb1f522654c58a652ca1cf5217e5923542583196ba5a4505fcfe'),
          }
          assert os.environ['GITHUB_REPOSITORY'] == REPO
          HEADERS = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          def api(path, method='GET', payload=None):
              headers = dict(HEADERS)
              data = None if payload is None else json.dumps(payload).encode()
              if data is not None:
                  headers['Content-Type'] = 'application/json'
              request = urllib.request.Request('https://api.github.com/repos/' + REPO + path, data=data, headers=headers, method=method)
              with urllib.request.urlopen(request, timeout=120) as response:
                  return json.load(response)

          def digest(file):
              with file.open('rb') as source:
                  return hashlib.file_digest(source, 'sha256').hexdigest()

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, message, headers, target):
                  return None

          run = api('/actions/runs/' + str(RUN))
          assert run['head_sha'] == SHA and run['conclusion'] == 'success' and run['status'] == 'completed'
          assert run['path'] == '.github/workflows/desktop.yml'
          existing = api('/releases?per_page=100')
          assert not any(release['tag_name'] == TAG for release in existing), 'Release already exists; refusing to replace it'
          try:
              ref = api('/git/ref/tags/' + TAG)
              assert ref['object']['type'] == 'commit' and ref['object']['sha'] == SHA, 'Tag points to another source'
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          artifacts = api('/actions/runs/' + str(RUN) + '/artifacts')['artifacts']
          assert len(artifacts) == 3 and {a['name'] for a in artifacts} == set(EXPECTED)
          with tempfile.TemporaryDirectory(prefix='desktop-preview-') as temporary:
              root = pathlib.Path(temporary)
              assets = {}
              for artifact in artifacts:
                  name = artifact['name']
                  artifact_id, expected_hash = EXPECTED[name]
                  assert artifact['id'] == artifact_id and not artifact['expired'] and artifact['digest'] == 'sha256:' + expected_hash
                  request = urllib.request.Request('https://api.github.com/repos/' + REPO + '/actions/artifacts/' + str(artifact_id) + '/zip', headers=HEADERS)
                  try:
                      urllib.request.build_opener(NoRedirect).open(request, timeout=120)
                      raise RuntimeError('Expected an artifact download redirect')
                  except urllib.error.HTTPError as redirect:
                      if redirect.code != 302:
                          raise
                      download = redirect.headers['Location']
                  archive_file = root / (name + '.zip')
                  with urllib.request.urlopen(download, timeout=180) as response, archive_file.open('wb') as destination:
                      shutil.copyfileobj(response, destination, 4 * 1024 * 1024)
                  assert archive_file.stat().st_size == artifact['size_in_bytes'] and digest(archive_file) == expected_hash, 'Artifact archive integrity mismatch'
                  directory = root / name
                  directory.mkdir()
                  with zipfile.ZipFile(archive_file) as archive:
                      for entry in archive.infolist():
                          relative = pathlib.PurePosixPath(entry.filename)
                          assert len(relative.parts) == 1 and not relative.is_absolute() and relative.name not in ('.', '..') and '\\' not in entry.filename
                          assert not entry.is_dir() and not stat.S_ISLNK(entry.external_attr >> 16)
                          with archive.open(entry) as source, (directory / relative.name).open('xb') as destination:
                              shutil.copyfileobj(source, destination, 4 * 1024 * 1024)
                  archive_file.unlink()
                  manifest_file = directory / 'desktop-package.json'
                  manifest = json.loads(manifest_file.read_text())
                  target = name.removeprefix('desktop-unsigned-')
                  assert manifest['target'] == target and manifest['signing'] == 'unsigned' and manifest['version'] == '0.1.0'
                  records = manifest['artifacts']
                  recorded_names = {record['path'] for record in records}
                  assert len(recorded_names) == len(records)
                  assert {file.name for file in directory.iterdir()} == recorded_names | {'desktop-package.json'}
                  installers = set()
                  for record in records:
                      filename = record['path']
                      assert pathlib.PurePosixPath(filename).name == filename and '\\' not in filename
                      file = directory / filename
                      assert digest(file) == record['sha256'], 'Installer manifest checksum mismatch'
                      assert filename not in assets
                      assets[filename] = (file, record['sha256'])
                      if file.suffix != '.blockmap':
                          installers.add(file.suffix)
                  assert installers == ({'.exe'} if target == 'win32-x64' else {'.dmg', '.zip'})
                  assets['desktop-package-' + target + '.json'] = (manifest_file, digest(manifest_file))
                  print(json.dumps({'verified': target, 'files': len(records)}), flush=True)
              checksums = root / 'SHA256SUMS.txt'
              checksums.write_text(''.join(checksum + '  ' + name + '\n' for name, (_, checksum) in sorted(assets.items())))
              assets[checksums.name] = (checksums, digest(checksums))
              body = '''## Desktop preview — unsigned / ad-hoc

          Windows x64 NSIS and macOS 15+ Intel/Apple Silicon DMG/ZIP. The application bundles Node and PostgreSQL; local mode does not require preinstalled Docker, Node, or PostgreSQL.

          Source: `a063dc07b06f82c1123dfeeb3f93b22b0fb33542`.
          Native CI: https://github.com/Crsei/project-management-agent-v4/actions/runs/41750883115
          Original CI artifacts are promoted without rebuilding. Later parallel changes are not included.

          ### Verification
          - Windows: desktop 53 passed, 2 symbolic-link cases skipped; native filesystem/attachments 17 passed.
          - macOS Intel and Apple Silicon: each desktop 55 passed; native filesystem/attachments 15 passed.
          - All three: packaged SDK/PTY loading, managed PostgreSQL initialization, migrations/storage bootstrap, password login, workspace authorization, Agent/Web access, same-instance restart and owned-process cleanup passed without ambient development tools.
          - `SHA256SUMS.txt` and per-platform `desktop-package-*.json` provide checksums. The packaged application version remains 0.1.0; the release tag identifies this preview.

          ### Known limits / 已知限制
          - This is a prerelease, not a stable or fully accepted production release.
          - Windows is unsigned; macOS uses ad-hoc signing, not Developer ID signing or notarization. SmartScreen/Gatekeeper may warn or block execution.
          - Target-platform installer/uninstaller GUI acceptance and real Provider inference are not yet completed. No automatic update feed is configured.
          - Native desktop checks do not imply all repository checks pass; existing backend/typecheck issues remain documented in the delivery record.
          - Session and persistence design is not yet unified; existing Agent Chat persistence remains in use.
          - This private repository requires access permission to download assets.
          '''
              release = api('/releases', 'POST', {'tag_name': TAG, 'target_commitish': SHA, 'name': 'Desktop v0.1.0-preview.1 (unsigned)', 'body': body, 'draft': True, 'prerelease': True, 'make_latest': 'false'})
              print(json.dumps({'draft_release_id': release['id'], 'assets_to_upload': len(assets)}), flush=True)
              upload_base = release['upload_url'].split('{', 1)[0]
              for name, (file, checksum) in sorted(assets.items()):
                  headers = dict(HEADERS, **{'Content-Type': 'application/octet-stream', 'Content-Length': str(file.stat().st_size)})
                  with file.open('rb') as source:
                      request = urllib.request.Request(upload_base + '?name=' + urllib.parse.quote(name), data=source, headers=headers, method='POST')
                      with urllib.request.urlopen(request, timeout=900) as response:
                          uploaded = json.load(response)
                  assert uploaded['state'] == 'uploaded' and uploaded['size'] == file.stat().st_size and uploaded['digest'] == 'sha256:' + checksum
                  print(json.dumps({'uploaded': name, 'bytes': uploaded['size'], 'digest': uploaded['digest']}), flush=True)
              remote = api('/releases/' + str(release['id']) + '/assets?per_page=100')
              assert {asset['name'] for asset in remote} == set(assets)
              for asset in remote:
                  file, checksum = assets[asset['name']]
                  assert asset['state'] == 'uploaded' and asset['size'] == file.stat().st_size and asset['digest'] == 'sha256:' + checksum
              published = api('/releases/' + str(release['id']), 'PATCH', {'draft': False, 'prerelease': True, 'make_latest': 'false'})
              ref = api('/git/ref/tags/' + TAG)
              assert ref['object']['type'] == 'commit' and ref['object']['sha'] == SHA
              assert not published['draft'] and published['prerelease']
              print(json.dumps({'published': published['html_url'], 'source': SHA, 'verified_assets': len(remote)}), flush=True)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('Published verified prerelease: ' + published['html_url'] + '\n\nSource: `' + SHA + '`; verified assets: ' + str(len(remote)) + '\n')
