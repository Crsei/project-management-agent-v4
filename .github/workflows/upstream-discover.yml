name: Discover selected upstream source changes

# Initially manual only. A schedule requires the explicit opt-in procedure in
# docs/guides/upstream-source-maintenance.md; discovery never starts an Agent.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-discover-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  discover:
    name: Read-only discovery / ${{ matrix.project }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [t3code, cc-switch]
    steps:
      - uses: actions/checkout@v6
        with:
          # Do not execute a user-selected candidate checkout with any token.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Inspect fixed upstream in an isolated read-only source cache
        env:
          UPSTREAM_PROJECT: ${{ matrix.project }}
          GIT_TERMINAL_PROMPT: '0'
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: /dev/null
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import { spawnSync } from 'node:child_process';
          const project = process.env.UPSTREAM_PROJECT;
          if (!['t3code', 'cc-switch'].includes(project)) throw new Error('Unsupported fixed profile');
          const { loadProfile } = await import(`./scripts/upstream-sync/${project}.mjs`);
          const profile = await loadProfile(process.cwd());
          if (!/^https:\/\/github\.com\/[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+(?:\.git)?$/.test(profile.upstreamUrl)) throw new Error('Profile must identify a public fixed GitHub HTTPS upstream');
          const temporary = await fs.mkdtemp(path.join(process.env.RUNNER_TEMP, `upstream-${project}-`));
          const source = path.join(temporary, 'source.git');
          const reports = path.join(process.env.RUNNER_TEMP, `upstream-discovery-${project}`);
          await fs.mkdir(reports, { recursive: false });
          const git = (args) => {
            const result = spawnSync('git', ['-c', 'core.hooksPath=/dev/null', '-c', 'protocol.file.allow=never', ...args], { encoding: 'utf8', maxBuffer: 8 * 1024 * 1024 });
            if (result.status !== 0) throw new Error('Read-only upstream fetch/identity operation failed');
            return result.stdout.trim();
          };
          git(['init', '--bare', '--template=', source]);
          git(['--git-dir', source, 'remote', 'add', 'origin', profile.upstreamUrl]);
          git(['--git-dir', source, 'fetch', '--no-recurse-submodules', '--no-tags', '--depth=1', 'origin', 'HEAD']);
          const target = git(['--git-dir', source, 'rev-parse', '--verify', 'FETCH_HEAD^{commit}']);
          if (!/^[a-f0-9]{40}$/.test(target)) throw new Error('Unresolved upstream target');
          for (const commit of new Set([profile.upstreamCommit, ...profile.inputs.map((input) => input.commit)])) {
            if (!/^[a-f0-9]{40}$/.test(commit)) throw new Error('Invalid pinned source identity');
            git(['--git-dir', source, 'fetch', '--no-recurse-submodules', '--no-tags', '--depth=1', 'origin', commit]);
          }
          const result = spawnSync(process.execPath, ['scripts/upstream-sync.mjs', 'inspect', '--project', project, '--root', process.cwd(), '--source', source, '--target', target, '--output', path.join(reports, 'inspect.json')], { encoding: 'utf8', maxBuffer: 16 * 1024 * 1024 });
          await fs.writeFile(path.join(reports, 'discovery.json'), JSON.stringify({ project, hostCommit: git(['rev-parse', '--verify', 'HEAD^{commit}']), triggeringCommit: process.env.GITHUB_SHA, upstreamUrl: profile.upstreamUrl, baseline: profile.upstreamCommit, target, inspectExitCode: result.status, scope: 'read-only discovery, not candidate verification or publication' }, null, 2) + '\n');
          await fs.appendFile(process.env.GITHUB_STEP_SUMMARY, `### ${project}\nBaseline: \`${profile.upstreamCommit}\`\n\nDiscovered target: \`${target}\`\n\nInspect exit code: ${result.status}. Read the artifact for relevant changes, no-change, or blockers. No pin, branch, PR, schedule, or Agent was changed.\n`);
          if (result.status !== 0) {
            // Retain the failure rather than turning drift/conflicts into green discovery.
            process.stderr.write(result.stderr || 'Inspect reported blockers; review its artifact.\n');
            process.exitCode = 1;
          }
          NODE
      - name: Retain discovery identity and inspect report (not verified handoff)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-discovery-${{ matrix.project }}
          path: ${{ runner.temp }}/upstream-discovery-${{ matrix.project }}/
          if-no-files-found: error
          retention-days: 14
