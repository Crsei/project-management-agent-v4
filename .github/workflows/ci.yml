name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

# Fork PR code receives no write token, protected environment or Provider/signing secrets.
permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: PM / Web / Agent / Rust / contracts / sources
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: '11.9.0'
          run_install: false
      - name: Locate pnpm content store and hosted toolchain image
        id: pnpm-cache
        shell: bash
        run: |
          echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
      - name: Restore exact dependency content store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.path }}
          # No prefix fallback, node_modules, build outputs, homes or credentials.
          # The hosted image also scopes any approved native install side effects.
          key: checks-pnpm-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.pnpm-cache.outputs.image }}-${{ hashFiles('.node-version', 'rust-toolchain.toml', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'patches/*.patch', 'vendor/t3code/patches/*.patch') }}
      - name: Install native compiler and real Linux namespace prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config bubblewrap util-linux
      - name: Install repository-pinned Rust without changing its version
        shell: bash
        run: |
          RUST_VERSION=$(node --input-type=module -e 'import fs from "node:fs"; const text=fs.readFileSync("rust-toolchain.toml","utf8"); const match=/^channel\s*=\s*"([^"]+)"/m.exec(text); if(!match) throw new Error("Missing pinned Rust channel"); process.stdout.write(match[1]);')
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Check upstream maintenance protocols without publication credentials
        shell: bash
        run: |
          PRIVATE_HOME="$(mktemp -d)"
          trap 'rm -rf "$PRIVATE_HOME"' EXIT
          env -i PATH="$PATH" HOME="$PRIVATE_HOME" TMPDIR="$RUNNER_TEMP" \
            GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null CI=true \
            node --test scripts/upstream-sync/*.test.mjs scripts/upstream-publish.test.mjs
          node_modules/.bin/oxlint --deny-warnings scripts/upstream-sync.mjs scripts/upstream-sync scripts/upstream-publish.mjs scripts/upstream-publish.test.mjs
      - name: Run complete isolated repository checks
        # Creates its own loopback-random PG16/MinIO containers and synthetic
        # credentials; never loads .env, reuses a service or counts skips as passes.
        # Native installers/signing and real Provider/network Skill acceptance are separate.
        run: node scripts/check-ci.mjs
      - name: Preserve isolated check timings even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-check-timings-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/ci-runs/*.jsonl
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
