name: Temporary Windows desktop startup diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  powershell-startup:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.9.0'
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agent-workspace/desktop runtime:prepare --platform win32 --arch x64
      - name: Diagnose native blob directory boundary
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import cp from 'node:child_process';
          import {syncBuiltinESMExports} from 'node:module';
          const originalExec=cp.execFileSync;
          const queries=new Map(),started=Date.now();let nativeCalls=0,nativeMilliseconds=0;
          cp.execFileSync=(file,args,options)=>{
            const native=args?.some(value=>value.includes('class PmNativePathAttributes')),start=Date.now();
            try{return originalExec(file,args,options);}
            catch(error){if(args?.some(value=>value.includes('class PmNativePathAttributes')))console.error(String(error.stderr));throw error;}
            finally{if(native){nativeCalls++;nativeMilliseconds+=Date.now()-start;for(const filename of JSON.parse(options.input))queries.set(filename,(queries.get(filename)??0)+1);}}
          };
          syncBuiltinESMExports();
          import {mkdtemp,realpath,rm} from 'node:fs/promises';
          import {tmpdir} from 'node:os';
          import {join} from 'node:path';
          import {SafeDirectory} from './packages/infrastructure/src/portable-directory.ts';
          import {LocalBlobStore} from './packages/infrastructure/src/blobs.ts';
          import {ensurePrivateDirectory} from './apps/desktop/src/private-state.mjs';
          const root=await realpath(await mkdtemp(join(tmpdir(),'desktop-blob-diagnostic-')));
          try{
            await ensurePrivateDirectory(root,{newlyCreated:true});
            const blobs=join(root,'blobs');await ensurePrivateDirectory(blobs);
            const directory=await SafeDirectory.open(blobs,true);
            await directory.identity();await directory.close();
            const store=new LocalBlobStore(blobs);await store.init();
            const saved=await store.put(Buffer.from('native blob boundary'));
            if((await store.read(saved.key)).toString()!=='native blob boundary')throw new Error('Blob content mismatch');
            console.log(JSON.stringify({nativeBlobRoundTrip:true,elapsedMilliseconds:Date.now()-started,nativeCalls,nativeMilliseconds,queries:[...queries]}));
          }finally{await rm(root,{recursive:true,force:true});}
          NODE
      - name: Verify native file identity and blob storage regressions
        run: pnpm exec node --conditions=development --test packages/pm-core/tests/platform.test.ts packages/infrastructure/tests/blobs.test.ts
      - name: Verify native PostgreSQL lifecycle and restored services
        shell: bash
        run: |
          export PM_DESKTOP_TEST_POSTGRES_ROOT="$(node -p "require('node:path').resolve('apps/desktop/.runtime/desktop-runtime/postgres')")"
          node --test apps/desktop/src/managed-postgres.test.mjs apps/desktop/src/backend/bootstrap.test.ts apps/desktop/src/local-server.test.mjs
