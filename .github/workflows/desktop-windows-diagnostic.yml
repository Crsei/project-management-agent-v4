name: Temporary Windows desktop startup diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  powershell-startup:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
      - name: Exercise real private metadata and owned process lifecycle
        run: node --test apps/desktop/src/private-state.test.mjs apps/desktop/src/local-process.test.mjs
