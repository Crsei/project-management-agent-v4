name: Temporary Windows desktop startup diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  powershell-startup:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
      - name: Isolate environment and stdin startup requirements
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {execFile} from 'node:child_process';
          import {join} from 'node:path';
          const root=process.env.SystemRoot;
          const executable=join(root,'System32','WindowsPowerShell','v1.0','powershell.exe');
          const minimal={SystemRoot:root,WINDIR:root};
          const selected=keys=>Object.fromEntries(keys.flatMap(key=>process.env[key]===undefined?[]:[[key,process.env[key]]]));
          const service={...minimal,...selected(['PATH','TEMP','TMP','TMPDIR'])};
          const profile={...service,...selected(['USERPROFILE','APPDATA','LOCALAPPDATA','HOMEDRIVE','HOMEPATH','PSModulePath'])};
          const script="$ErrorActionPreference='Stop'; [Console]::Out.WriteLine('before-item'); $item=Get-Item -LiteralPath $env:PM_DIAGNOSTIC_PATH; [Console]::Out.WriteLine('before-acl'); $acl=Get-Acl -LiteralPath $env:PM_DIAGNOSTIC_PATH; [Console]::Out.WriteLine('before-compile'); Add-Type -TypeDefinition 'public static class Probe { public static int Value() {return 1;} }'; [Console]::Out.WriteLine('modules-ready')";
          for(const [name,env] of [['minimal',minimal],['service',service],['profile',profile],['inherited',process.env]]){
            for(const closeInput of [false,true]){
              const started=Date.now();
              await new Promise(resolve=>{
                const child=execFile(executable,['-NoLogo','-NoProfile','-NonInteractive','-Command',script],{env:{...env,PM_DIAGNOSTIC_PATH:process.cwd()},windowsHide:true,timeout:10000},(error,stdout,stderr)=>{
                  console.log(JSON.stringify({name,closeInput,elapsedMs:Date.now()-started,code:error?.code,killed:error?.killed,signal:error?.signal,stdout:stdout.trim(),stderr:stderr.trim()}));resolve();
                });
                if(closeInput)child.stdin.end();
              });
            }
          }
          NODE
