name: Temporary Windows desktop startup diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  powershell-startup:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.9.0'
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Observe native repository directory traversal
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {syncBuiltinESMExports} from 'node:module';
          import {tmpdir} from 'node:os';
          import path from 'node:path';
          const originalMkdir=fs.mkdirSync,originalStat=fs.lstatSync;let previous='',repeated=0;
          fs.mkdirSync=(filename,options)=>{const created=originalMkdir(filename,options);console.log(JSON.stringify({mkdir:filename,created}));return created;};
          fs.lstatSync=(filename,options)=>{
            repeated=filename===previous?repeated+1:0;previous=filename;
            if(repeated>40&&filename===path.parse(filename).root)throw new Error('Repeated volume-root traversal: '+filename);
            return originalStat(filename,options);
          };
          syncBuiltinESMExports();
          const {FileRepository,revisionOf}=await import('./packages/pm-core/repository.ts');
          const root=fs.realpathSync(fs.mkdtempSync(path.join(tmpdir(),'desktop-repository-diagnostic-')));
          try{
            const repository=new FileRepository(root,false);
            console.log('Initializing repository');repository.init();
            console.log('Creating nested directory');repository.mkdir('nested/deep');
            repository.write('nested/deep/note.md','first');
            repository.write('nested/deep/note.md','second',revisionOf('first'));
            if(repository.read('nested/deep/note.md')!=='second')throw new Error('Repository content mismatch');
            repository.remove('nested/deep/note.md',revisionOf('second'));
            console.log(JSON.stringify({nativeRepositoryRoundTrip:true}));
          }finally{fs.rmSync(root,{recursive:true,force:true});}
          NODE
