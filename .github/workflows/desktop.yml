name: Desktop native installers

# Manual only: creating/editing this workflow never publishes or triggers builds.
on:
  workflow_dispatch:
    inputs:
      distribution:
        description: Unsigned test artifacts, or signed/notarized artifacts using the protected signing environment
        type: choice
        options: [unsigned, signed]
        default: unsigned
        required: true
      windows_only:
        description: Build Windows x64 only, without starting macOS jobs
        type: boolean
        default: true
        required: true
      install_e2e:
        description: Explicitly authorize real installer lifecycle in a new isolated Windows account (never enabled by default)
        type: boolean
        default: false
        required: true
      baseline_run_id:
        description: Exact successful workflow run containing the lower-version baseline Windows delivery
        type: string
        required: false
      baseline_run_attempt:
        description: Exact baseline run attempt recorded in its desktop-package.json
        type: string
        required: false
      baseline_artifact_name:
        description: Exact baseline delivery artifact name from that run (no latest lookup)
        type: string
        required: false
      baseline_installer_sha256:
        description: Independently supplied SHA256 of the exact lower-version NSIS installer
        type: string
        required: false
      release_action:
        description: Explicit GitHub Release action; none builds artifacts only, draft is not an update, publish makes a complete release visible
        type: choice
        options: [none, draft, publish]
        default: none
        required: true
      release_channel:
        description: preview requires preview.N; stable requires a stable version and signed installers
        type: choice
        options: [preview, stable]
        default: preview
        required: true
      release_tag:
        description: Existing exact v-prefixed application version tag; required for draft/publish
        type: string
        required: false
      expected_sha:
        description: Full lowercase 40-hex source SHA, identical to the dispatch ref; required for draft/publish
        type: string
        required: false
      ci_run_id:
        description: Exact successful Repository checks push run for expected_sha; required for draft/publish
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: desktop-${{ inputs.release_tag || format('{0}-{1}', github.ref, inputs.distribution) }}
  cancel-in-progress: false

env:
  # The complete Web type graph exceeds the 2 GiB default on hosted macOS.
  NODE_OPTIONS: --max-old-space-size=4096
  DESKTOP_ARTIFACT_DIR: ${{ github.workspace }}/apps/desktop/releases/ci-${{ github.run_id }}-${{ github.run_attempt }}
  DESKTOP_DELIVERY_DIR: ${{ github.workspace }}/apps/desktop/releases/delivery-${{ github.run_id }}-${{ github.run_attempt }}
  PM_DESKTOP_TEST_POSTGRES_ROOT: ${{ github.workspace }}/apps/desktop/.runtime/desktop-runtime/postgres
  DESKTOP_RELEASE_ACTION: ${{ inputs.release_action }}
  DESKTOP_RELEASE_CHANNEL: ${{ inputs.release_channel }}
  DESKTOP_RELEASE_TAG: ${{ inputs.release_tag }}
  DESKTOP_RELEASE_SHA: ${{ inputs.expected_sha }}
  DESKTOP_CI_RUN_ID: ${{ inputs.ci_run_id }}
  DESKTOP_DISTRIBUTION: ${{ inputs.distribution }}
  DESKTOP_WINDOWS_ONLY: ${{ inputs.windows_only }}

jobs:
  release-preflight:
    name: Verify exact desktop release identity and prior publication
    if: inputs.release_action != 'none'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      already_published: ${{ steps.preflight.outputs.already_published }}
      staged_draft: ${{ steps.preflight.outputs.staged_draft }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Reject mismatched tag, version, SHA, channel and CI provenance
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/desktop-release.mjs preflight

  release-authorization:
    name: Hard third-party release authorization gate
    if: inputs.release_action != 'none'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Keep every recorded OPEN blocker fatal, including preview tests
        run: node scripts/check-third-party-notices.mjs --release

  unsigned:
    needs: [release-preflight]
    if: >-
      ${{ !cancelled() && inputs.distribution == 'unsigned'
        && (inputs.release_action == 'none'
          || (needs.release-preflight.result == 'success' && needs.release-preflight.outputs.already_published != 'true'
            && needs.release-preflight.outputs.staged_draft != 'true')) }}
    name: Unsigned ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(inputs.windows_only
            && '[{"os":"windows-2025","platform":"win32","arch":"x64"}]'
            || '[{"os":"windows-2025","platform":"win32","arch":"x64"},{"os":"macos-15-intel","platform":"darwin","arch":"x64"},{"os":"macos-15","platform":"darwin","arch":"arm64"}]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          architecture: ${{ matrix.arch }}
      - uses: pnpm/action-setup@v4
      - name: Locate pnpm content store and hosted toolchain image
        id: pnpm-cache
        shell: bash
        run: |
          echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
      - name: Restore exact dependency content store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.path }}
          # Signed and unsigned caches stay separate. Never cache node_modules,
          # built applications, user homes, keychains or signing materials.
          key: desktop-${{ inputs.distribution }}-pnpm-v1-${{ matrix.os }}-${{ runner.arch }}-${{ steps.pnpm-cache.outputs.image }}-${{ hashFiles('.node-version', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'patches/*.patch', 'vendor/t3code/patches/*.patch') }}
      - name: Configure Windows C++ compiler and SDK
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Preflight pinned build tools without installation or service access
        run: node scripts/doctor.mjs
      - name: Install locked native runner dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore integrity-pinned runtime download archives
        uses: actions/cache@v4
        with:
          # Only source archives: runtime:prepare still checks pinned SHA256,
          # cross-checks Node's official checksum, extracts and inventories anew.
          path: apps/desktop/.cache/runtime-downloads
          key: desktop-${{ inputs.distribution }}-runtime-archives-v1-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('.node-version', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'apps/desktop/scripts/runtime-manifest.mjs', 'apps/desktop/scripts/prepare-runtime.mjs') }}
      - name: Prepare integrity-pinned offline Node and complete PostgreSQL
        run: pnpm --filter @agent-workspace/desktop runtime:prepare --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
      - name: Execute bundled runtime tools without ambient PATH
        run: pnpm --filter @agent-workspace/desktop runtime:smoke
      - name: Build shared workspace type declarations
        run: pnpm --filter @agent-workspace/contracts build && pnpm --filter @agent-workspace/client-runtime build
      - name: Build Agent desktop maintenance entry
        run: pnpm --filter @agent-workspace/server build
      - name: Typecheck desktop backend helpers
        run: pnpm --filter @agent-workspace/desktop typecheck
      - name: Desktop contracts
        timeout-minutes: 10
        run: pnpm --filter @agent-workspace/desktop test:contracts
      - name: Desktop process lifecycle and private filesystem regressions
        timeout-minutes: 15
        run: pnpm --filter @agent-workspace/desktop test:lifecycle
      - name: Desktop real PostgreSQL bootstrap and restricted-token regressions
        timeout-minutes: 20
        run: pnpm --filter @agent-workspace/desktop test:integration
      - name: Desktop encrypted backup and restore regressions
        timeout-minutes: 25
        run: pnpm --filter @agent-workspace/desktop test:backup
      - name: Native filesystem identity, private permissions and reparse regressions
        timeout-minutes: 10
        run: pnpm exec node --conditions=development --test --test-concurrency=1 --test-timeout=180000 packages/pm-core/tests/platform.test.ts packages/infrastructure/tests/blobs.test.ts
      - name: Desktop release materials and final archive regressions
        timeout-minutes: 25
        run: pnpm --filter @agent-workspace/desktop test:release
      - name: Build explicitly unsigned native installers
        run: pnpm --filter @agent-workspace/desktop package --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --output "$env:DESKTOP_ARTIFACT_DIR"
        if: runner.os == 'Windows'
      - name: Report verified Windows archive file counts
        if: runner.os == 'Windows'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          import { join } from "node:path";
          const verification = JSON.parse(await readFile(join(process.env.DESKTOP_ARTIFACT_DIR, "desktop-verification.json"), "utf8"));
          const final = verification.checks.finalArtifacts;
          if (final.status !== "passed" || !final.artifacts.length) throw new Error("Missing final archive verification.");
          for (const artifact of final.artifacts) {
            if (!artifact.payloadReport?.budgets.withinLimit) throw new Error("Final archive exceeds its payload budget.");
            console.log(JSON.stringify({ artifact: artifact.path, sha256: artifact.sha256, payload: artifact.payloadReport }));
          }
          NODE
      - name: Build explicitly unsigned native installers
        run: pnpm --filter @agent-workspace/desktop package --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --output "$DESKTOP_ARTIFACT_DIR"
        if: runner.os == 'macOS'
      - name: Verify final archive payloads and execute native runtime smoke (not installer or GUI)
        shell: bash
        run: node apps/desktop/scripts/verify-delivery.mjs --output "$DESKTOP_ARTIFACT_DIR" --native-smoke --stage "$DESKTOP_DELIVERY_DIR"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-unsigned-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: ${{ env.DESKTOP_DELIVERY_DIR }}/

  signed:
    needs: [release-preflight]
    if: >-
      ${{ !cancelled() && inputs.distribution == 'signed'
        && (inputs.release_action == 'none'
          || (needs.release-preflight.result == 'success' && needs.release-preflight.outputs.already_published != 'true'
            && needs.release-preflight.outputs.staged_draft != 'true')) }}
    name: Signed ${{ matrix.platform }}-${{ matrix.arch }}
    # Configure approval and repository-owned certificate secrets here. Missing
    # materials fail closed; this job never falls back to unsigned output.
    environment: desktop-signing
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(inputs.windows_only
            && '[{"os":"windows-2025","platform":"win32","arch":"x64"}]'
            || '[{"os":"windows-2025","platform":"win32","arch":"x64"},{"os":"macos-15-intel","platform":"darwin","arch":"x64"},{"os":"macos-15","platform":"darwin","arch":"arm64"}]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          architecture: ${{ matrix.arch }}
      - uses: pnpm/action-setup@v4
      - name: Locate pnpm content store and hosted toolchain image
        id: pnpm-cache
        shell: bash
        run: |
          echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
      - name: Restore exact dependency content store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.path }}
          # Signed and unsigned caches stay separate. Never cache node_modules,
          # built applications, user homes, keychains or signing materials.
          key: desktop-${{ inputs.distribution }}-pnpm-v1-${{ matrix.os }}-${{ runner.arch }}-${{ steps.pnpm-cache.outputs.image }}-${{ hashFiles('.node-version', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'patches/*.patch', 'vendor/t3code/patches/*.patch') }}
      - name: Configure Windows C++ compiler and SDK
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Preflight pinned build tools without installation or service access
        run: node scripts/doctor.mjs
      - name: Install locked native runner dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore integrity-pinned runtime download archives
        uses: actions/cache@v4
        with:
          # Only source archives: runtime:prepare still checks pinned SHA256,
          # cross-checks Node's official checksum, extracts and inventories anew.
          path: apps/desktop/.cache/runtime-downloads
          key: desktop-${{ inputs.distribution }}-runtime-archives-v1-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('.node-version', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'apps/desktop/scripts/runtime-manifest.mjs', 'apps/desktop/scripts/prepare-runtime.mjs') }}
      - name: Prepare integrity-pinned offline Node and complete PostgreSQL
        run: pnpm --filter @agent-workspace/desktop runtime:prepare --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
      - name: Execute bundled runtime tools without ambient PATH
        run: pnpm --filter @agent-workspace/desktop runtime:smoke
      - name: Build shared workspace type declarations
        run: pnpm --filter @agent-workspace/contracts build && pnpm --filter @agent-workspace/client-runtime build
      - name: Build Agent desktop maintenance entry
        run: pnpm --filter @agent-workspace/server build
      - name: Typecheck desktop backend helpers
        run: pnpm --filter @agent-workspace/desktop typecheck
      - name: Desktop contracts
        timeout-minutes: 10
        run: pnpm --filter @agent-workspace/desktop test:contracts
      - name: Desktop process lifecycle and private filesystem regressions
        timeout-minutes: 15
        run: pnpm --filter @agent-workspace/desktop test:lifecycle
      - name: Desktop real PostgreSQL bootstrap and restricted-token regressions
        timeout-minutes: 20
        run: pnpm --filter @agent-workspace/desktop test:integration
      - name: Desktop encrypted backup and restore regressions
        timeout-minutes: 25
        run: pnpm --filter @agent-workspace/desktop test:backup
      - name: Native filesystem identity, private permissions and reparse regressions
        timeout-minutes: 10
        run: pnpm exec node --conditions=development --test --test-concurrency=1 --test-timeout=180000 packages/pm-core/tests/platform.test.ts packages/infrastructure/tests/blobs.test.ts
      - name: Desktop release materials and final archive regressions
        timeout-minutes: 25
        run: pnpm --filter @agent-workspace/desktop test:release
      - name: Build Authenticode-signed NSIS installer
        if: runner.os == 'Windows'
        env:
          CSC_LINK: ${{ secrets.DESKTOP_WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_WINDOWS_CSC_KEY_PASSWORD }}
          PM_DESKTOP_WINDOWS_SIGNER_SUBJECT: ${{ vars.DESKTOP_WINDOWS_SIGNER_SUBJECT }}
          PM_DESKTOP_WINDOWS_SIGNER_SHA256: ${{ vars.DESKTOP_WINDOWS_SIGNER_SHA256 }}
        run: pnpm --filter @agent-workspace/desktop package:signed --platform win32 --arch x64 --output "$env:DESKTOP_ARTIFACT_DIR"
      - name: Build Developer ID-signed and notarized DMG and ZIP
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.DESKTOP_MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.DESKTOP_APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.DESKTOP_APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.DESKTOP_APPLE_TEAM_ID }}
          PM_DESKTOP_MAC_TEAM_ID: ${{ vars.DESKTOP_MAC_TEAM_ID }}
        run: pnpm --filter @agent-workspace/desktop package:signed --platform darwin --arch ${{ matrix.arch }} --output "$DESKTOP_ARTIFACT_DIR"
      - name: Verify signed final archive payloads and execute native runtime smoke (not installer or GUI)
        shell: bash
        run: node apps/desktop/scripts/verify-delivery.mjs --output "$DESKTOP_ARTIFACT_DIR" --native-smoke --stage "$DESKTOP_DELIVERY_DIR"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-signed-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: ${{ env.DESKTOP_DELIVERY_DIR }}/

  install-e2e:
    name: Opt-in real Windows installation lifecycle
    needs: [unsigned, signed]
    if: >-
      ${{ always() && inputs.install_e2e == true
        && ((inputs.distribution == 'unsigned' && needs.unsigned.result == 'success')
          || (inputs.distribution == 'signed' && needs.signed.result == 'success')) }}
    runs-on: windows-2025
    timeout-minutes: 180
    # Cross-run baseline download is read-only; no workflow dispatch or release.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          architecture: x64
      - uses: pnpm/action-setup@v4
      - name: Require exact supplied true-upgrade baseline before any lifecycle
        shell: pwsh
        env:
          BASELINE_RUN_ID: ${{ inputs.baseline_run_id }}
          BASELINE_ATTEMPT: ${{ inputs.baseline_run_attempt }}
          BASELINE_ARTIFACT: ${{ inputs.baseline_artifact_name }}
          BASELINE_SHA256: ${{ inputs.baseline_installer_sha256 }}
        run: |
          if ($env:BASELINE_RUN_ID -notmatch '^\d+$' -or $env:BASELINE_ATTEMPT -notmatch '^[1-9]\d*$' -or [string]::IsNullOrWhiteSpace($env:BASELINE_ARTIFACT) -or $env:BASELINE_SHA256 -notmatch '^[a-f0-9]{64}$') {
            throw 'BLOCKED: install-e2e requires an exact older-version delivery run/attempt, artifact name and installer SHA256. Same-version overwrite is not N to N+1.'
          }
      - name: Download exact candidate delivery from this run
        uses: actions/download-artifact@v4
        with:
          name: desktop-${{ inputs.distribution }}-win32-x64
          path: ${{ runner.temp }}/desktop-e2e-current-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Download supplied exact baseline delivery without dispatching a workflow
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.baseline_artifact_name }}
          run-id: ${{ inputs.baseline_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/desktop-e2e-baseline-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Install locked verifier dependencies (no installer lifecycle)
        run: pnpm install --frozen-lockfile
      - name: Verify both complete delivery material sets before execution
        shell: pwsh
        env:
          INSTALL_E2E_CURRENT: ${{ runner.temp }}/desktop-e2e-current-${{ github.run_id }}-${{ github.run_attempt }}
          INSTALL_E2E_BASELINE: ${{ runner.temp }}/desktop-e2e-baseline-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          node apps/desktop/scripts/verify-delivery.mjs --output "$env:INSTALL_E2E_CURRENT" --files-only
          if ($LASTEXITCODE -ne 0) { throw 'Candidate material verification failed' }
          node apps/desktop/scripts/verify-delivery.mjs --output "$env:INSTALL_E2E_BASELINE" --files-only
          if ($LASTEXITCODE -ne 0) { throw 'Baseline material verification failed' }
      - name: Execute native lifecycle in a new standard account and private roots
        shell: pwsh
        env:
          BASELINE_RUN_ID: ${{ inputs.baseline_run_id }}
          BASELINE_ATTEMPT: ${{ inputs.baseline_run_attempt }}
          BASELINE_SHA256: ${{ inputs.baseline_installer_sha256 }}
          INSTALL_E2E_CURRENT: ${{ runner.temp }}/desktop-e2e-current-${{ github.run_id }}-${{ github.run_attempt }}
          INSTALL_E2E_BASELINE: ${{ runner.temp }}/desktop-e2e-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          INSTALL_E2E_EXPORT: ${{ runner.temp }}/desktop-e2e-evidence-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          & apps/desktop/scripts/install-e2e/provision-windows.ps1 -ExecuteInstallerLifecycle `
            -Delivery "$env:INSTALL_E2E_CURRENT" -Baseline "$env:INSTALL_E2E_BASELINE" `
            -BaselineSha256 "$env:BASELINE_SHA256" -BaselineRunId "$env:BASELINE_RUN_ID" `
            -BaselineRunAttempt "$env:BASELINE_ATTEMPT" -ExportParent "$env:INSTALL_E2E_EXPORT"
      - name: Bind verified receipt and exact evidence hashes to candidate delivery
        shell: pwsh
        env:
          INSTALL_E2E_CURRENT: ${{ runner.temp }}/desktop-e2e-current-${{ github.run_id }}-${{ github.run_attempt }}
          INSTALL_E2E_EXPORT: ${{ runner.temp }}/desktop-e2e-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          INSTALL_E2E_BOUND_DELIVERY: ${{ runner.temp }}/desktop-e2e-bound-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          node apps/desktop/scripts/verify-delivery.mjs --output "$env:INSTALL_E2E_CURRENT" `
            --install-e2e-receipt "$env:INSTALL_E2E_EXPORT/diagnostics/install-e2e-receipt.json" `
            --stage "$env:INSTALL_E2E_BOUND_DELIVERY"
          if ($LASTEXITCODE -ne 0) { throw 'Native receipt validation failed; installation must not be marked passed' }
      - name: Preserve diagnostics on success, blocked criteria and failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-install-e2e-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
          path: ${{ runner.temp }}/desktop-e2e-evidence-${{ github.run_id }}-${{ github.run_attempt }}/
      - name: Upload delivery with independently verified native receipt
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ inputs.distribution }}-win32-x64-install-e2e
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: ${{ runner.temp }}/desktop-e2e-bound-${{ github.run_id }}-${{ github.run_attempt }}/

  release:
    name: Stage complete native assets then explicitly retain draft or publish
    needs: [release-preflight, release-authorization, unsigned, signed, install-e2e]
    if: >-
      ${{ !cancelled() && inputs.release_action != 'none'
        && needs.release-preflight.result == 'success'
        && needs.release-preflight.outputs.already_published != 'true'
        && needs.release-authorization.result == 'success'
        && (needs.release-preflight.outputs.staged_draft == 'true'
          || (inputs.distribution == 'unsigned' && needs.unsigned.result == 'success')
          || (inputs.distribution == 'signed' && needs.signed.result == 'success'))
        && (inputs.install_e2e != true || needs.install-e2e.result == 'success') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    # No other job can mutate GitHub Releases; source-evidence release.yml cannot.
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Test release orchestration state and immutable-asset rules
        run: node --test scripts/desktop-release.test.mjs
      - name: Download exact Windows native delivery from this run
        if: needs.release-preflight.outputs.staged_draft != 'true'
        uses: actions/download-artifact@v4
        with:
          name: desktop-${{ inputs.distribution }}-win32-x64${{ inputs.install_e2e && '-install-e2e' || '' }}
          path: ${{ runner.temp }}/desktop-release-deliveries/desktop-${{ inputs.distribution }}-win32-x64
      - name: Download exact Intel macOS native delivery from this run
        if: inputs.windows_only != true && needs.release-preflight.outputs.staged_draft != 'true'
        uses: actions/download-artifact@v4
        with:
          name: desktop-${{ inputs.distribution }}-darwin-x64
          path: ${{ runner.temp }}/desktop-release-deliveries/desktop-${{ inputs.distribution }}-darwin-x64
      - name: Download exact Apple Silicon native delivery from this run
        if: inputs.windows_only != true && needs.release-preflight.outputs.staged_draft != 'true'
        uses: actions/download-artifact@v4
        with:
          name: desktop-${{ inputs.distribution }}-darwin-arm64
          path: ${{ runner.temp }}/desktop-release-deliveries/desktop-${{ inputs.distribution }}-darwin-arm64
      - name: Reverify every gate, source identity and asset before changing visibility
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP_RELEASE_DELIVERIES: ${{ runner.temp }}/desktop-release-deliveries
          DESKTOP_RELEASE_STAGE: ${{ runner.temp }}/desktop-release-stage
        run: node scripts/desktop-release.mjs release
      - name: Retain exact staged release evidence even if draft upload fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-${{ inputs.release_tag }}-${{ github.run_id }}-${{ github.run_attempt }}
